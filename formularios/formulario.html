<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio - Formulario</title>
    <!-- CSS propio -->
    <link rel="stylesheet" href="../css/styles.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- CABECERA -->
    <header class="cabecera">
        <div class="cabecera-contenido">
            <div class="cabecera-marca">
                <span class="cabecera-icono">PHP</span>
                <div>
                    <h1>Ejercicios PHP</h1>
                    <p>Trabajando con Formularios</p>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="contenedor">
        <div class="titulo-ejercicio">
            <h2>Formulario</h2>
        </div>

        <div class="tarjeta">
            <form action="formulario.php" method="post">

                <!-- NOMBRE -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>

                <!-- APELLIDOS -->
                <div class="mb-3">
                    <label for="apellidos" class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="apellidos" name="apellidos" required>
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <!-- URL -->
                <div class="mb-3">
                    <label for="url" class="form-label">Página personal</label>
                    <input type="url" class="form-control" id="url" name="url" placeholder="https://ejemplo.com" required>
                </div>

                <!-- SEXO -->
                <div class="mb-3">
                    <label class="form-label">Sexo</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sexo" id="hombre" value="Hombre" required>
                        <label class="form-check-label" for="hombre">Hombre</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sexo" id="mujer" value="Mujer">
                        <label class="form-check-label" for="mujer">Mujer</label>
                    </div>
                </div>

                <!-- CONVIVIENTES -->
                <div class="mb-3">
                    <label for="convivientes" class="form-label">Número de convivientes en el domicilio</label>
                    <input type="number" class="form-control" id="convivientes" name="convivientes" min="1" required>
                </div>

                <!-- AFICIONES -->
                <div class="mb-3">
                    <label class="form-label">Aficiones</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="aficiones[]" value="Videojuegos" id="videojuegos">
                        <label class="form-check-label" for="videojuegos">Videojuegos</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="aficiones[]" value="Deporte" id="deporte">
                        <label class="form-check-label" for="deporte">Deporte</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="aficiones[]" value="Música" id="musica">
                        <label class="form-check-label" for="musica">Música</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="aficiones[]" value="Cine" id="cine">
                        <label class="form-check-label" for="cine">Cine</label>
                    </div>
                </div>

                <!-- MENÚ FAVORITO -->
                <div class="mb-4">
                    <label for="menu" class="form-label">Menú favorito</label>
                    <select class="form-select" name="menu[]" id="menu" multiple size="4" required>
                        <option value="Pizza">Pizza</option>
                        <option value="Hamburguesa">Hamburguesa</option>
                        <option value="Paella">Paella</option>
                        <option value="Pasta">Pasta</option>
                    </select>

                    <div class="form-text">
                        Puedes seleccionar varias opciones.
                    </div>
                </div>

                <!-- BOTÓN -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send me-1"></i>
                        Enviar formulario
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="pie">
        <div class="pie-contenido">
            <p>Ejercicios PHP · DAW</p>
        </div>
    </footer>
</body>

</html>
